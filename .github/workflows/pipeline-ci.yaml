name: CI/CD Pipeline IoT
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
    Test:
      name: Unit Test
      runs-on: ubuntu-latest
      steps:
          - name: Code Clone
            uses: actions/checkout@v4
            with:
              fetch-depth: 0
            continue-on-error: true
          - name: Setup Java JDK
            uses: actions/setup-java@v3
            with:
              java-version: '21'
              distribution: 'temurin'
            continue-on-error: true
          - name: Unit Test
            run: |
              mvn package test
            continue-on-error: true
            working-directory: iot-api
    Analyze:
        name: SonarCloud Analyze
        needs: Test
        runs-on: ubuntu-latest
        steps:
            - name: Code Clone
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Setup Java JDK
              uses: actions/setup-java@v3
              with:
                java-version: '21'
                distribution: 'temurin'
            - name: Run Tests with Coverage
              run: mvn clean verify
              working-directory: iot-api
              continue-on-error: true
            - name: Cache SonarQube package
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar
              continue-on-error: true
            - name: Cache Maven packages
              uses: actions/cache@v4
              with:
                  path: ~/.m2
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-m2
            - name: Check Quality Gate
              run: |
                  STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
                    "https://sonarcloud.io/api/qualitygates/project_status?projectKey=cristian-aliaga_iot_backend_java" \
                    | jq -r '.projectStatus.status')
                  if [ "$STATUS" != "OK" ]; then
                    echo "Quality Gate failed: $STATUS"
                    exit 1
                  fi
              working-directory: iot-api
              continue-on-error: true
            - name: Build and analyze
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=cristian-aliaga_iot_backend_java
              working-directory: iot-api
              continue-on-error: true
    Build:
      name: Build and Push Docker Image
      needs: Analyze
      runs-on: ubuntu-latest
      steps:
          - name: Code Clone
            uses: actions/checkout@v4
            with:
              fetch-depth: 0
          - name: Setup Java JDK
            uses: actions/setup-java@v3
            with:
              java-version: '21'
              distribution: 'temurin'
          - name: Compilation
            run: |
                  mvn package -Dmaven.test.skip
            working-directory: iot-api
          - name: Docker Login
            uses: docker/login-action@v3.1.0
            with: 
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_PASSWORD }}
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v2.7.0
          - name: Docker Build
            run: |
              docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/repo-image:latest .
            working-directory: iot-api
          - name: Docker Push
            run: |
              docker push ${{ secrets.DOCKERHUB_USERNAME }}/repo-image:latest
            working-directory: iot-api
    Deploy:
        name: Deploy Container
        needs: Build
        runs-on: self-hosted
        steps:
            - name: Code Clone
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Deploy Docker Container
              run: |
                    docker pull cristianaliaga/repo-image:latest
                    docker stop iot_backend_java || true
                    docker rm iot_backend_java || true
                    docker run -d --name iot_backend_java -p 8443:8443 cristianaliaga/repo-image:latest
              working-directory: iot-api